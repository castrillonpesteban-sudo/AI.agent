# Configuración para Fly.io. Cambia el nombre y la región antes de desplegar:
#
#   fly launch --no-deploy      (usa este archivo)
#   fly volumes create datos_asistente --size 1 --region bog
#   fly secrets set TELEGRAM_BOT_TOKEN=... TELEGRAM_CHATS_PERMITIDOS=...
#   fly deploy

app = "asistente-personal"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

[build.args]
  SALIDA_STANDALONE = "1"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TZ_USUARIO = "America/Bogota"

# El volumen es obligatorio: sin él se pierden las tareas en cada despliegue.
[[mounts]]
  source = "datos_asistente"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # El bot sondea a Telegram desde el propio proceso, así que la máquina no
  # puede dormirse por falta de tráfico web.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
