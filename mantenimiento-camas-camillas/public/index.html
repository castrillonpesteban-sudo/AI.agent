<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantenimiento Camas y Camillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f6f5; --surface:#ffffff; --surface-2:#f8faf9;
  --ink:#171d1c; --ink-2:#5a6664; --ink-3:#8b9593;
  --line:#e2e7e5; --line-2:#cfd6d4;
  --accent:#0d6a63; --accent-soft:#e6efed;
  --pend:#98a2a0;
  --mp:#96601b; --mp-bg:#fbf0da; --mp-ink:#5c3c0f;
  --keep:#39618f; --keep-bg:#e3ecf7; --keep-ink:#213c5c;
  --ok:#1a6f4b; --ok-bg:#dceee3; --ok-ink:#0f4530;
  --warn:#9c3a34;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0f1413; --surface:#151b1a; --surface-2:#1a2120;
    --ink:#e9efed; --ink-2:#a4b0ae; --ink-3:#7a8785;
    --line:#242e2d; --line-2:#33403e;
    --accent:#5cbfb3; --accent-soft:#16302d;
    --pend:#818d8b;
    --mp:#e8b878; --mp-bg:#3a2b12; --mp-ink:#f3d6a3;
    --keep:#9fbeea; --keep-bg:#1c2c40; --keep-ink:#c3d6f2;
    --ok:#7ed4a6; --ok-bg:#153427; --ok-ink:#aeead0;
    --warn:#dd8a84;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}

header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:3px;margin-right:auto}
.brand h1{font-size:17px;font-weight:600}
.brand .sub{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:9px}
.who label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
select.who-sel{border-bottom:1px solid var(--line-2);padding:3px 18px 3px 2px;font-size:14px;
  cursor:pointer;background:transparent;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 8px) calc(50% + 1px),calc(100% - 4px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
select.who-sel:hover{border-color:var(--accent)}
.btn{border:1px solid var(--line-2);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.gauge{display:flex;align-items:center;gap:11px}
.gauge .num{font-family:Archivo;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.gauge .lbl{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)} .dot.wait{background:var(--pend)}
.connstat{display:flex;align-items:center;font-size:11.5px;color:var(--ink-3)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));
  gap:0 26px;border-bottom:1px solid var(--line);padding-block:22px 20px}
.sum-cell{display:flex;flex-direction:column;gap:3px;padding-block:6px}
.sum-cell .nm{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.sum-cell .vl{font-family:Archivo;font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sum-cell .vl span{font-size:11.5px;font-weight:400;color:var(--ink-3);font-family:"IBM Plex Sans";letter-spacing:0}

nav.tabs{display:flex;gap:26px;overflow-x:auto;padding-block:4px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;display:flex;flex-direction:column;gap:5px;align-items:flex-start;
  cursor:pointer;padding:14px 0 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-3)}
nav.tabs button .t{font-family:Archivo;font-weight:600;font-size:14px;color:var(--ink-2)}
nav.tabs button .r{font-size:11px;font-variant-numeric:tabular-nums}
nav.tabs button:hover .t{color:var(--ink)}
nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent)}
nav.tabs button[aria-selected="true"] .t{color:var(--ink)}
nav.tabs button[aria-selected="true"] .r{color:var(--accent)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:18px 10px}
.search{flex:1 1 220px;min-width:0;background:transparent;border:none;border-bottom:1px solid var(--line-2);padding:7px 2px;font-size:14px}
.search::placeholder{color:var(--ink-3)}
.search:focus{outline:none;border-bottom-color:var(--accent)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-3)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}

.group-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-block:14px 8px}
.group-head h2{font-size:15px;font-weight:600}
.group-head .meta{font-size:12.5px;color:var(--ink-3)}
.group-head .meta strong{color:var(--ink-2);font-weight:500}
.rows{display:flex;flex-direction:column;padding-bottom:56px;border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);background:var(--surface)}
.rhead{display:grid;grid-template-columns:108px 1fr auto auto;gap:14px;align-items:center;padding:11px 12px;cursor:pointer}
.rhead:hover{background:var(--surface-2)}
.placa{font-family:"IBM Plex Mono";font-size:13px;font-weight:500;letter-spacing:-.02em;color:var(--ink-2)}
.loc{font-size:14px;line-height:1.35}
.loc .eq{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.stages{display:flex;gap:4px}
.st{border:1px solid var(--line-2);border-radius:99px;padding:4px 10px;font-size:10.5px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;line-height:1.3;color:var(--ink-3)}
.st:hover{border-color:var(--ink-3);color:var(--ink-2)}
.st.on-mp{border-color:var(--mp);background:var(--mp-bg);color:var(--mp-ink);font-weight:600}
.st.on-keep{border-color:var(--keep);background:var(--keep-bg);color:var(--keep-ink);font-weight:600}
.st.on-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.pill{font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.pendiente{color:var(--pend)} .pill.mp{color:var(--mp)} .pill.keeper{color:var(--keep)} .pill.ok{color:var(--ok)}
.row.done .placa,.row.done .loc{color:var(--ink-3)}

.detail{border-top:1px solid var(--line);background:var(--surface-2);padding:18px 12px 16px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:16px}
.detail label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.detail input,.detail textarea,.detail select{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
  padding:8px 9px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.detail input:focus,.detail textarea:focus,.detail select:focus{outline:none;border-color:var(--accent)}
.detail .wide{grid-column:1/-1}
.detail textarea{min-height:64px;resize:vertical;font-family:inherit;line-height:1.5}
.dmeta{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
.linkish{color:var(--warn);font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.empty{padding:36px 14px;text-align:center;color:var(--ink-3);font-size:14px}
.banner{margin-top:16px;padding:10px 13px;border-radius:var(--r);background:var(--surface);color:var(--mp);font-size:12.5px;border:1px solid var(--line-2)}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .rhead{grid-template-columns:1fr auto;grid-template-areas:"pl pill" "loc loc" "st st";gap:9px;padding:13px 4px}
  .placa{grid-area:pl}.loc{grid-area:loc}.stages{grid-area:st}.pill{grid-area:pill;justify-self:end}
  .detail{padding-inline:4px}
  .top-in{gap:14px}.brand{flex:1 1 100%}
  nav.tabs{gap:20px}
  .summary{gap:0 18px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1>Mantenimiento de camas y camillas</h1>
      <div class="sub">Clínica Victoriana · Ingeniería Biomédica · <span id="periodo"></span></div>
    </div>
    <div class="who">
      <label for="ingeniero">Ingeniero</label>
      <select class="who-sel" id="ingeniero"></select>
    </div>
    <div class="connstat" id="connstat"><span class="dot wait"></span>Conectando…</div>
    <div class="gauge">
      <div><div class="num" id="gnum">0%</div><div class="lbl">Cerradas</div></div>
      <div class="bar"><i id="gbar" style="width:0%"></i></div>
    </div>
    <button class="btn" id="csv">Exportar CSV</button>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <section class="summary" id="summary"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Buscar placa, habitación o servicio" autocomplete="off">
    <div class="chips" id="filters">
      <button class="chip" data-f="all" aria-pressed="true">Todas</button>
      <button class="chip" data-f="pendiente" aria-pressed="false">Pendientes</button>
      <button class="chip" data-f="proceso" aria-pressed="false">En proceso</button>
      <button class="chip" data-f="ok" aria-pressed="false">Cerradas</button>
    </div>
  </div>
  <div class="group-head" id="ghead"></div>
  <div class="rows" id="rows"></div>
</main>

const POLL_MS = 6000;

const ITEMS = [];
GRUPOS.forEach(g => g.items.forEach(it => ITEMS.push(Object.assign({g: g.id, gn: g.nombre, resp: g.resp}, it))));

let state = {};
let tab = GRUPOS[0].id;
let filter = "all";
let query = "";
let open = null;
let online = null;
const timers = {};

const blank = () => ({mp:false,fecha:"",mpi:"",tec:"",rep:"",obs:"",keeper:false,firma:false,upd:""});
function st(p){ return Object.assign(blank(), state[p] || {}); }
function fase(s){ if (s.firma) return "ok"; if (s.keeper) return "keeper"; if (s.mp) return "mp"; return "pendiente"; }
const FASE_TXT = {pendiente:"Pendiente", mp:"Falta Keeper", keeper:"Falta firma", ok:"Cerrada"};
function hoy(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function setConn(kind){
  online = kind;
  const el = document.getElementById("connstat");
  if (kind === "on") el.innerHTML = '<span class="dot on"></span>Guardado compartido activo';
  else if (kind === "off") el.innerHTML = '<span class="dot off"></span>Sin conexión con el servidor';
  else el.innerHTML = '<span class="dot wait"></span>Conectando…';
}

async function fetchState(){
  try{
    const r = await fetch("/api/state", {cache:"no-store"});
    if (!r.ok){
      if (r.status === 503) flash("La base de datos todavía no está conectada en Vercel. Conéctala en Storage y vuelve a cargar.");
      setConn("off"); return;
    }
    const data = await r.json() || {};
    // Conserva los cambios locales que aun no se han guardado en el servidor
    Object.keys(timers).forEach(pl => { if (timers[pl] && state[pl]) data[pl] = state[pl]; });
    if (editing() && open && state[open]) data[open] = state[open];
    state = data;
    setConn("on");
    // Si el usuario esta escribiendo o eligiendo fecha, no redibuja la lista
    if (editing()){ renderTabs(); renderSummary(); } else render();
  }catch(e){ setConn("off"); }
}

async function push(placa, patch){
  try{
    const r = await fetch("/api/state", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({placa, patch})
    });
    if (!r.ok){ setConn("off"); flash("No se pudo guardar el cambio. Intenta de nuevo en un momento."); return; }
    setConn("on");
  }catch(e){ setConn("off"); }
}
function queue(placa){
  clearTimeout(timers[placa]);
  timers[placa] = setTimeout(()=>{ delete timers[placa]; push(placa, state[placa]); }, 500);
}
function editing(){
  const a = document.activeElement;
  return !!(a && a.closest && a.closest("#rows .detail") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function flash(msg){ document.getElementById("banner").innerHTML = '<div class="banner">'+msg+'</div>'; }

function mutate(placa, patch, now){
  const s = st(placa);
  Object.assign(s, patch);
  s.upd = new Date().toISOString();
  state[placa] = s;
  render();
  if (now) push(placa, s); else queue(placa);
}
function toggle(placa, etapa){
  const s = st(placa);
  const ing = document.getElementById("ingeniero").value;
  if (etapa === "mp"){
    if (s.mp) return mutate(placa,{mp:false,keeper:false,firma:false},true);
    return mutate(placa,{mp:true, fecha: s.fecha || hoy(), tec: s.tec || ing},true);
  }
  if (etapa === "keeper"){
    if (s.keeper) return mutate(placa,{keeper:false,firma:false},true);
    return mutate(placa,{mp:true, keeper:true, fecha: s.fecha || hoy(), tec: s.tec || ing},true);
  }
  if (etapa === "firma"){
    if (s.firma) return mutate(placa,{firma:false},true);
    return mutate(placa,{mp:true, keeper:true, firma:true, fecha: s.fecha || hoy(), tec: s.tec || ing},true);
  }
}

function visibles(){
  const q = query.trim().toLowerCase();
  return ITEMS.filter(it => {
    if (it.g !== tab) return false;
    if (q && !(it.p.toLowerCase().includes(q) || it.u.toLowerCase().includes(q) || it.m.toLowerCase().includes(q))) return false;
    const f = fase(st(it.p));
    if (filter === "all") return true;
    if (filter === "pendiente") return f === "pendiente";
    if (filter === "ok") return f === "ok";
    if (filter === "proceso") return f === "mp" || f === "keeper";
    return true;
  });
}
function conteo(list){ const c = {total:list.length, pendiente:0, mp:0, keeper:0, ok:0}; list.forEach(it => c[fase(st(it.p))]++); return c; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function renderTabs(){
  const n = document.getElementById("tabs");
  n.innerHTML = GRUPOS.map(g => {
    const c = conteo(ITEMS.filter(i => i.g === g.id));
    const pct = c.total ? Math.round(c.ok/c.total*100) : 0;
    return '<button role="tab" aria-selected="'+(g.id===tab)+'" data-g="'+g.id+'">'+
      '<span class="t">'+esc(g.nombre)+'</span><span class="r">'+esc(g.resp)+' · '+c.ok+'/'+c.total+'</span></button>';
  }).join("");
  n.querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.g; open = null; render(); });
}
function renderSummary(){
  const el = document.getElementById("summary");
  const all = conteo(ITEMS);
  const porResp = {};
  GRUPOS.forEach(g => {
    const c = conteo(ITEMS.filter(i => i.g === g.id));
    porResp[g.resp] = porResp[g.resp] || {ok:0,total:0};
    porResp[g.resp].ok += c.ok; porResp[g.resp].total += c.total;
  });
  let cells = '<div class="sum-cell"><span class="nm">Equipos del mes</span><span class="vl">'+all.total+' <span>camas y camillas</span></span></div>'+
    '<div class="sum-cell"><span class="nm">Sin intervenir</span><span class="vl">'+all.pendiente+' <span>pendientes</span></span></div>'+
    '<div class="sum-cell"><span class="nm">En proceso</span><span class="vl">'+(all.mp+all.keeper)+' <span>'+all.mp+' sin Keeper · '+all.keeper+' sin firma</span></span></div>'+
    '<div class="sum-cell"><span class="nm">Cerradas</span><span class="vl">'+all.ok+' <span>con firma de la jefe</span></span></div>';
  Object.keys(porResp).forEach(r => {
    const v = porResp[r];
    cells += '<div class="sum-cell"><span class="nm">'+esc(r)+'</span><span class="vl">'+v.ok+'/'+v.total+' <span>'+(v.total?Math.round(v.ok/v.total*100):0)+'%</span></span></div>';
  });
  el.innerHTML = cells;
  const pct = all.total ? Math.round(all.ok/all.total*100) : 0;
  document.getElementById("gnum").textContent = pct + "%";
  document.getElementById("gbar").style.width = pct + "%";
}
function renderRows(){
  const g = GRUPOS.find(x => x.id === tab);
  const list = visibles();
  const c = conteo(ITEMS.filter(i => i.g === tab));
  document.getElementById("ghead").innerHTML =
    '<h2>'+esc(g.nombre)+'</h2><span class="meta">Responsable: <strong>'+esc(g.resp)+'</strong></span>'+
    '<span class="meta">'+c.ok+' cerradas · '+(c.mp+c.keeper)+' en proceso · '+c.pendiente+' pendientes de '+c.total+'</span>';
  const cont = document.getElementById("rows");
  if (!list.length){ cont.innerHTML = '<div class="empty">No hay equipos con ese filtro.</div>'; return; }
  cont.innerHTML = list.map(it => {
    const s = st(it.p), f = fase(s), abierto = open === it.p;
    return '<article class="row'+(f==="ok"?" done":"")+'" data-p="'+esc(it.p)+'">'+
      '<div class="rhead" data-act="open">'+
        '<span class="placa">'+esc(it.p)+'</span>'+
        '<span class="loc">'+esc(it.u)+'<span class="eq">'+esc(it.t)+' · '+esc(it.m)+' · Serie '+esc(it.s)+(s.mpi?' · MPI '+esc(s.mpi):'')+'</span></span>'+
        '<span class="stages">'+
          '<button class="st'+(s.mp?" on-mp":"")+'" data-act="mp" title="Mantenimiento ejecutado">MP</button>'+
          '<button class="st'+(s.keeper?" on-keep":"")+'" data-act="keeper" title="Reporte cargado en Keeper">Keeper</button>'+
          '<button class="st'+(s.firma?" on-ok":"")+'" data-act="firma" title="Firmado por la jefe del servicio">Firma</button>'+
        '</span>'+
        '<span class="pill '+f+'">'+FASE_TXT[f]+'</span>'+
      '</div>'+ (abierto ? detalle(it, s) : '') + '</article>';
  }).join("");
}
function detalle(it, s){
  return '<div class="detail">'+
    '<label>Fecha del mantenimiento<input type="date" data-f="fecha" value="'+esc(s.fecha)+'"></label>'+
    '<label>MPI (consecutivo)<input type="text" data-f="mpi" inputmode="numeric" placeholder="Ej. 4821" value="'+esc(s.mpi)+'"></label>'+
    '<label>Ingeniero que lo hizo<select data-f="tec"><option value="">Sin asignar</option>'+
      INGENIEROS.map(n => '<option'+(n===s.tec?' selected':'')+'>'+esc(n)+'</option>').join("")+
      (s.tec && INGENIEROS.indexOf(s.tec)<0 ? '<option selected>'+esc(s.tec)+'</option>' : '')+
    '</select></label>'+
    '<label>Repuesto usado<input type="text" data-f="rep" placeholder="Rueda, control, actuador…" value="'+esc(s.rep)+'"></label>'+
    '<label class="wide">Observaciones y novedades<textarea data-f="obs" placeholder="Qué se encontró, qué quedó pendiente, si requiere correctivo">'+esc(s.obs)+'</textarea></label>'+
    '<div class="dmeta"><span>'+(s.upd ? 'Último cambio: '+new Date(s.upd).toLocaleString("es-CO") : 'Sin registro todavía')+'</span>'+
    '<button class="linkish" data-act="reset">Borrar registro de este equipo</button></div>'+
  '</div>';
}
function render(){ renderTabs(); renderSummary(); renderRows(); }

document.getElementById("rows").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const placa = row.dataset.p;
  const act = e.target.dataset.act;
  if (act === "mp" || act === "keeper" || act === "firma"){ e.stopPropagation(); toggle(placa, act); return; }
  if (act === "reset"){
    delete state[placa]; render();
    fetch("/api/state", {method:"DELETE", headers:{"Content-Type":"application/json"}, body: JSON.stringify({placa})}).catch(()=>{});
    return;
  }
  if (e.target.closest(".detail")) return;
  open = (open === placa) ? null : placa;
  render();
});
function onField(e){
  const f = e.target.dataset.f; if (!f) return;
  const placa = e.target.closest(".row").dataset.p;
  const s = st(placa); s[f] = e.target.value; s.upd = new Date().toISOString();
  state[placa] = s; queue(placa);
}
document.getElementById("rows").addEventListener("input", onField);
document.getElementById("rows").addEventListener("change", onField);
document.getElementById("q").addEventListener("input", e => { query = e.target.value; renderRows(); });
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  renderRows();
});

function csv(){
  const head = ["Grupo","Responsable","Placa","Equipo","Marca y modelo","Serie","Ubicacion","Estado","Fecha","MPI","Ingeniero","Repuesto","Observaciones","Keeper","Firma jefe"];
  const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(",")];
  ITEMS.forEach(it => {
    const s = st(it.p);
    lines.push([it.gn,it.resp,it.p,it.t,it.m,it.s,it.u,FASE_TXT[fase(s)],s.fecha,s.mpi,s.tec,s.rep,s.obs,s.keeper?"SI":"NO",s.firma?"SI":"NO"].map(q).join(","));
  });
  return "﻿" + lines.join("\r\n");
}
document.getElementById("csv").onclick = () => {
  const blob = new Blob([csv()], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "mantenimiento-camas-" + hoy() + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
};

document.getElementById("periodo").textContent = PERIODO;
const selT = document.getElementById("ingeniero");
selT.innerHTML = '<option value="">Sin definir</option>' + INGENIEROS.map(t => '<option>'+esc(t)+'</option>').join("");
try { selT.value = localStorage.getItem(LS_TEC) || ""; } catch(e){}
selT.onchange = () => { try{ localStorage.setItem(LS_TEC, selT.value); }catch(e){} };

render();
fetchState();
setInterval(fetchState, POLL_MS);
</script>
</body>
